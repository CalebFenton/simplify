plugins {
    id 'application'
}


application {
    mainClass = 'org.cf.simplify.Main'
    applicationDefaultJvmArgs = ['--add-opens=java.base/java.lang=ALL-UNNAMED']
}

dependencies {
    implementation project(':smalivm')

    implementation depends.guava
    implementation depends.commons_cli
    implementation depends.slf4j_api
    implementation depends.logback

    testImplementation rootProject.project(':smalivm').sourceSets.test.output
    testImplementation depends.junit_compile
    testRuntimeOnly depends.junit_engine
    testRuntimeOnly depends.junit_launcher
}

test.dependsOn project(':smalivm').tasks.getByName('testClasses')

tasks.register('fatJar', Jar) {
    dependsOn configurations.runtimeClasspath
    archiveFileName = 'simplify.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    manifest {
        attributes('Main-Class': application.mainClass.get(), 'Add-Opens': 'java.base/java.lang')
    }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

