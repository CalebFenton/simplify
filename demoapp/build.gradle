plugins {
    id 'application'
}


application {
    mainClass = 'org.cf.demoapp.Main'
    applicationDefaultJvmArgs = ['--add-opens=java.base/java.lang=ALL-UNNAMED']
}

dependencies {
    implementation project(':smalivm')
    implementation depends.slf4j_api
    implementation depends.slf4j_nop
}

tasks.register('fatJar', Jar) {
    dependsOn configurations.runtimeClasspath
    archiveFileName = 'demoapp.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'

    manifest {
        attributes('Main-Class': application.mainClass.get(), 'Add-Opens': 'java.base/java.lang')
    }

    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}
