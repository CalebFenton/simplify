[versions]
jacoco = "0.8.16"
junit = "6.1.3"
kotlin = "2.4.21"
slf4j = "2.0.20"
smali = "3.0.10"

[libraries]
asm = "org.ow2.asm:asm:9.11.1"
commons-cli = "commons-cli:commons-cli:1.11.0"
commons-lang = "org.apache.commons:commons-lang3:3.21.0"
guava = "com.google.guava:guava:33.8.0-jre"
jansi = "org.fusesource.jansi:jansi:2.4.3"
jetbrains-annotations = "org.jetbrains:annotations:26.1.0"
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
kotlinx-immutable = "org.jetbrains.kotlinx:kotlinx-collections-immutable-jvm:0.5.2"
logback = "ch.qos.logback:logback-classic:1.6.6"
picocli-shell-jline3 = "info.picocli:picocli-shell-jline3:4.7.7"
proguard-gradle = "com.guardsquare:proguard-gradle:7.10.0"
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
smali = { module = "com.android.tools.smali:smali", version.ref = "smali" }
smali-baksmali = { module = "com.android.tools.smali:smali-baksmali", version.ref = "smali" }
smali-dexlib2 = { module = "com.android.tools.smali:smali-dexlib2", version.ref = "smali" }
smali-util = { module = "com.android.tools.smali:smali-util", version.ref = "smali" }

[bundles]
smali = ["smali-dexlib2", "smali", "smali-baksmali", "smali-util"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
